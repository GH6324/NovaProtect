# Installed automatically by configure_nginx.py. Do not paste/edit manually.
# The public CDN may connect to this origin over HTTP; PHP receives the
# canonical HTTPS scheme. All HTML/API/download/static responses bypass cache.
root @@DOCUMENT_ROOT@@;
index index.php;

location = /admin {
    client_max_body_size 260m;
    client_body_timeout 300s;
    try_files $uri /index.php?$query_string;
}

# Chunked admin upload transport. The browser sends one 512 KB slice per
# request as base64 text, so the body limit only has to cover a single slice
# instead of the whole installer. Keeping the limit small is deliberate: it is
# what stops a stray multipart POST from ever reaching PHP.
location ^~ /api/ {
    client_max_body_size 4m;
    client_body_timeout 120s;
    try_files $uri /index.php?$query_string;
}

location ^~ /.well-known/acme-challenge/ {
    root /www/wwwroot/nova.fbi.plus/current/public;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ ^/index\.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $document_root;
    fastcgi_param HTTPS on;
    fastcgi_param HTTP_X_FORWARDED_PROTO https;
    fastcgi_param HTTP_X_FORWARDED_HOST nova.fbi.plus;
    fastcgi_pass @@PHP_SOCKET@@;
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;
}

# BaoTa uses this include to classify the site as PHP 8.4 in the panel.
# The explicit location above remains first so the application's HTTPS and
# cache parameters are preserved; the include also provides BaoTa's path-info
# location for administrators who manage the site from the panel.
include enable-php-84.conf;

location ~ /\. {
    deny all;
}

location ~* \.(?:bak|conf|dist|fla|ini|log|sh|sql|sqlite|tmp|yaml|yml)$ {
    deny all;
}

expires off;
add_header Cache-Control "no-store, private, max-age=0, no-cache, must-revalidate" always;
add_header CDN-Cache-Control "no-store" always;
add_header Surrogate-Control "no-store" always;
add_header Vary "Cookie" always;
